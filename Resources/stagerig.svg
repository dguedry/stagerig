<?xml version="1.0" encoding="UTF-8"?>
<!-- StageRig: the signal on a dark stage, lit blue from one side and amber from the other
     (the wallpaper's own picture), over the keys. Colours as Source/Theme.h. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#001a3a"/>
      <stop offset="0.55" stop-color="#000712"/>
      <stop offset="1" stop-color="#00040b"/>
    </linearGradient>
    <radialGradient id="hazeB" cx="0.08" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#0087fc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0087fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hazeA" cx="0.92" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#f08a14" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#f08a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4db0ff"/>
      <stop offset="1" stop-color="#0087fc"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbb04a"/>
      <stop offset="1" stop-color="#f08a14"/>
    </linearGradient>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#faf4eb"/>
    </linearGradient>
    <clipPath id="tile"><rect x="0" y="0" width="512" height="512" rx="104" ry="104"/></clipPath>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="104" ry="104" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="512" height="512" fill="url(#hazeB)"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#hazeA)"/>
    <!-- the signal: blue into amber, as on the wallpaper -->
    <rect x="49" y="176" width="42" height="104" rx="21" fill="url(#b)"/>
    <rect x="111" y="128" width="42" height="200" rx="21" fill="url(#b)"/>
    <rect x="173" y="78" width="42" height="300" rx="21" fill="url(#b)"/>
    <rect x="235" y="42" width="42" height="372" rx="21" fill="url(#w)"/>
    <rect x="297" y="78" width="42" height="300" rx="21" fill="url(#a)"/>
    <rect x="359" y="128" width="42" height="200" rx="21" fill="url(#a)"/>
    <rect x="421" y="176" width="42" height="104" rx="21" fill="url(#a)"/>
    <!-- the keys it is played on -->
    <rect x="0" y="456" width="512" height="56" fill="#faf4eb"/>
    <g fill="#000712">
      <rect x="71" y="456" width="4" height="56"/><rect x="144" y="456" width="4" height="56"/>
      <rect x="217" y="456" width="4" height="56"/><rect x="290" y="456" width="4" height="56"/>
      <rect x="363" y="456" width="4" height="56"/><rect x="436" y="456" width="4" height="56"/>
      <rect x="52" y="456" width="42" height="32" rx="5"/><rect x="125" y="456" width="42" height="32" rx="5"/>
      <rect x="271" y="456" width="42" height="32" rx="5"/><rect x="344" y="456" width="42" height="32" rx="5"/>
      <rect x="417" y="456" width="42" height="32" rx="5"/>
    </g>
  </g>
</svg>
